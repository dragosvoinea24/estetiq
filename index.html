:root{--bk:#0A0A0A;--wh:#FFFFFF;--rd:#FF3030;--gy:#8C8C8C;--gy2:#2A2A2A;--gy3:#161616;--f:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bk)}
body{background:var(--bk);color:var(--wh);font-family:var(--f);font-weight:600;line-height:1.35;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.pbar{position:fixed;left:0;right:0;top:0;height:5px;background:transparent;z-index:20}
.pbar i{display:block;height:100%;width:0;background:var(--rd);transition:width .3s ease}
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 22px 0;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brand{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--gy);text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
h1,h2{font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.98}
h1{font-size:clamp(46px,15vw,76px)}
h1 em,h2 em{font-style:normal;color:var(--rd)}
h2{font-size:clamp(34px,10.5vw,50px)}
.sub{font-weight:800;font-size:clamp(19px,5.4vw,24px);line-height:1.25;margin-top:22px}
.txt{font-size:17px;color:#D8D8D8;margin-top:14px}
.small{font-size:13px;color:var(--gy);font-weight:600}
.foot{position:sticky;bottom:0;background:var(--bk);padding:14px 0 calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.btn{appearance:none;border:0;cursor:pointer;width:100%;min-height:64px;padding:16px 18px;background:var(--rd);color:#fff;font-family:var(--f);font-weight:900;font-size:17px;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;transition:transform .12s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sec{background:transparent;border:2px solid #3a3a3a;color:#fff}
.lnk{appearance:none;background:none;border:0;color:var(--gy);font-family:var(--f);font-weight:700;font-size:14px;padding:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{appearance:none;background:var(--gy3);border:1px solid var(--gy2);color:#fff;width:46px;height:46px;border-radius:10px;font-size:22px;font-weight:900;cursor:pointer;font-family:var(--f)}
.cat{font-weight:900;font-size:13px;letter-spacing:.18em;color:var(--rd);text-transform:uppercase}
.cnt{font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--gy);min-width:46px;text-align:right}
.hint{font-size:13px;color:var(--gy);margin-top:26px}
.qtext{font-weight:800;text-transform:none;letter-spacing:0;font-size:clamp(25px,7.4vw,32px);line-height:1.2;margin-top:12px}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.opt{appearance:none;display:flex;align-items:center;gap:16px;width:100%;min-height:70px;padding:12px 16px;border:2px solid var(--gy2);background:var(--gy3);color:#fff;border-radius:12px;text-align:left;font-family:var(--f);font-weight:700;font-size:17px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt b{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#262626;font-weight:900;font-size:19px}
.opt:active{transform:scale(.985)}
.opt[aria-checked=true]{border-color:var(--rd);background:#2a0d0d}
.opt[aria-checked=true] b{background:var(--rd)}
.fwd{align-self:flex-end;margin-top:6px}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.card{border:2px solid var(--gy2);background:var(--gy3);border-radius:12px;padding:16px}
.card.low{border-color:var(--rd)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cn{font-weight:900;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.sc{font-weight:900;font-size:30px;line-height:1}
.sc small{font-size:15px;color:var(--gy);font-weight:800}
.track{height:12px;background:#262626;border-radius:6px;margin-top:12px;overflow:hidden}
.fill{height:100%;width:0;background:#fff;border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.card.low .fill{background:var(--rd)}
.tag{display:inline-block;margin-top:12px;background:var(--rd);color:#fff;font-weight:900;font-size:11px;letter-spacing:.14em;padding:5px 9px;border-radius:5px;text-transform:uppercase}
.int{font-size:14px;color:#CFCFCF;margin-top:10px;line-height:1.4}
.note{font-size:13px;color:var(--gy);margin-top:18px;line-height:1.45}
.pick{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.pk{appearance:none;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:62px;padding:12px 16px;border:2px solid var(--gy2);background:var(--gy3);color:#fff;border-radius:12px;font-family:var(--f);font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pk span{color:var(--gy);font-size:15px;font-weight:800;letter-spacing:0}
.pk[aria-checked=true]{border-color:var(--rd);background:#2a0d0d}
.pk[aria-checked=true] span{color:#fff}
label.fl{display:block;font-weight:800;font-size:15px;margin-top:22px}
textarea,input[type=text]{width:100%;margin-top:8px;background:var(--gy3);border:2px solid var(--gy2);border-radius:12px;color:#fff;font-family:var(--f);font-weight:600;font-size:17px;padding:14px;resize:none;min-height:64px}
textarea:focus,input[type=text]:focus{border-color:var(--rd);outline:none}
.chip{display:inline-block;background:var(--rd);color:#fff;font-weight:900;font-size:12px;letter-spacing:.14em;padding:6px 10px;border-radius:6px;text-transform:uppercase;margin-top:16px}
.days{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.day{appearance:none;display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 14px;border:2px solid var(--gy2);background:var(--gy3);color:#fff;border-radius:12px;text-align:left;font-family:var(--f);font-weight:700;font-size:15.5px;line-height:1.3;cursor:pointer}
.day .d{flex:none;font-weight:900;font-size:12px;letter-spacing:.12em;color:var(--rd);text-transform:uppercase;width:58px}
.day .t{flex:1}
.day .bx{flex:none;width:34px;height:34px;border:3px solid #555;border-radius:8px;display:grid;place-items:center}
.day[aria-checked=true]{border-color:#3d1a1a;background:#1d0e0e}
.day[aria-checked=true] .bx{background:var(--rd);border-color:var(--rd)}
.day[aria-checked=true] .bx:after{content:"";width:10px;height:18px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-2px)}
.day[aria-checked=true] .t{color:#BDBDBD}
.cnum{font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--gy);margin-top:18px}
.quote{font-weight:800;font-size:clamp(20px,5.8vw,25px);line-height:1.3;margin-top:22px}
.sys{border:2px solid var(--rd);border-radius:14px;padding:20px;margin-top:26px;background:var(--gy3)}
.sys h3{font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.sys p{font-size:16px;color:#D8D8D8;margin-top:10px}
.line{height:5px;width:72px;background:var(--rd);margin:0 0 18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#0A0A0A;font-weight:800;font-size:14px;padding:12px 18px;border-radius:10px;z-index:30;max-width:86vw;text-align:center;animation:in .2s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pbar" aria-hidden="true"><i id="pb"></i></div>
<div id="app"><main id="screen"></main></div>
<script>
(function(){
'use strict';
/* ====== Configurare ====== */
var SYSTEM_URL = ''; // Adaugă aici linkul către SISTEMUL ESTETIQ FIT înainte de publicare.
var KEY = 'estetiq_progress_check_v1';

/* ====== Conținut (din PDF) ====== */
var CATS = ['ANTRENAMENT','ALIMENTAȚIE','RECUPERARE','CONSECVENȚĂ'];
var LET = ['A','B','C','D'];
var Q = [
 'Am un plan de antrenament clar, nu aleg exercițiile complet la întâmplare.',
 'Urmăresc în timp cel puțin câteva repere: exerciții, repetări, greutăți sau calitatea execuției.',
 'Ajustez efortul atunci când tehnica sau recuperarea îmi arată că este nevoie.',
 'Am o structură a meselor care mă ajută să-mi susțin obiectivul și programul zilnic.',
 'Includ în mod regulat surse de proteine, legume/fructe și alimente care îmi oferă sațietate.',
 'Pot să fac alegeri echilibrate și în afara rutinei perfecte: la restaurant, în weekend sau când sunt ocupat.',
 'Am, în general, un program de somn suficient de constant pentru nevoile mele.',
 'Las timp pentru recuperare și nu transform fiecare antrenament într-un test maximal.',
 'Observ cum influențează somnul, stresul și oboseala felul în care mă antrenez.',
 'Am un program realist pe care îl pot respecta în majoritatea săptămânilor.',
 'Revin la rutină după o zi sau o săptămână mai puțin organizată, fără să abandonez planul.',
 'Știu care este următorul pas concret pe care vreau să-l îmbunătățesc.'
];
var OPT = ['Nu / aproape niciodată','Uneori / inconsistent','Da / în mod consecvent'];
var INTERP = [
 'Aici ai cel mai clar spațiu de lucru. Alege un singur comportament de îmbunătățit.',
 'Ai câteva lucruri funcționale, dar probabil îți lipsește constanța sau o structură mai clară.',
 'Este o zonă care pare bine susținută în perioada evaluată. Menține ce funcționează și verifică dacă rezultatele confirmă.'
];
var DAYS = [
 'Notează situația actuală. Ce faci acum și ce te încurcă cel mai des?',
 'Alege o acțiune concretă care ține de prioritatea ta.',
 'Aplic-o și observă ce a fost ușor sau dificil.',
 'Ajustează acțiunea ca să se potrivească mai bine programului tău.',
 'Repet-o. Nu căuta perfecțiunea, urmărește consecvența.',
 'Observă ce s-a schimbat și ce obstacol a rămas.',
 'Evaluează: păstrezi, ajustezi sau alegi un alt pas?'
];

/* ====== Stare ====== */
function fresh(){return {screen:'intro',q:0,a:new Array(12).fill(null),pr:null,obs:'',test:'',days:new Array(7).fill(false),focus:'',sign:''};}
var S = load();
function load(){
  try{var r=localStorage.getItem(KEY); if(r){var o=JSON.parse(r); var f=fresh();
    if(o&&Array.isArray(o.a)&&o.a.length===12&&Array.isArray(o.days)&&o.days.length===7){
      for(var k in f){ if(o[k]!==undefined) f[k]=o[k]; }
      if(['intro','q','result','priority','plan','end'].indexOf(f.screen)<0) f.screen='intro';
      if(typeof f.q!=='number'||f.q<0||f.q>11) f.q=0;
      return f; } } }catch(e){}
  return fresh();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* ====== Calcule ====== */
function scores(){ var s=[0,0,0,0]; for(var i=0;i<12;i++){ s[Math.floor(i/3)] += (S.a[i]||0); } return s; }
function band(n){ return n<=2?0:(n<=4?1:2); }
function lowest(sc){ var mn=Math.min.apply(null,sc), mx=Math.max.apply(null,sc); if(mn===mx) return []; var r=[]; sc.forEach(function(v,i){ if(v===mn) r.push(i); }); return r; }
function answeredCount(){ return S.a.filter(function(v){return v!==null;}).length; }
function allAnswered(){ return answeredCount()===12; }
function esc(t){ return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ====== Vizualizări ====== */
var root=document.getElementById('screen'), pb=document.getElementById('pb');
function brandRow(){ return '<div class="brand"><span>ESTETIQ FIT</span><span>PROGRESS CHECK</span></div>'; }

function vIntro(){
  return '<section class="scr">'+brandRow()+
  '<div class="main"><div class="line"></div><h1 id="h">Progress <em>check</em></h1>'+
  '<p class="sub">Înțelege ce funcționează. Identifică ce poți îmbunătăți.</p>'+
  '<p class="txt">12 întrebări. 4 zone importante. Un punct de plecare mai clar pentru progresul tău.</p>'+
  '<p class="small" style="margin-top:18px">Durează aproximativ 2–3 minute. Nu este un test medical. Răspunsurile rămân pe telefonul tău.</p></div>'+
  '<div class="foot"><button class="btn" data-act="start">'+(answeredCount()>0&&!allAnswered()?'Continuă evaluarea':(allAnswered()?'Vezi rezultatul':'Începe evaluarea'))+'</button>'+
  '<p class="small" style="text-align:center">Antrenează inteligent. Construiește conștient.</p></div></section>';
}
function vQ(){
  var i=S.q, c=Math.floor(i/3), v=S.a[i];
  var h='<section class="scr"><div class="qtop"><button class="back" data-act="back" aria-label="Înapoi">&larr;</button><span class="cat">'+LET[c]+'. '+CATS[c]+'</span><span class="cnt">'+(i+1)+' / 12</span></div>'+
  '<div class="main" style="justify-content:flex-start;padding-top:8px"><p class="hint">Gândește-te la ultimele 3–4 săptămâni, nu la cea mai bună săptămână a ta.</p>'+
  '<h2 class="qtext" id="h" tabindex="-1">'+esc(Q[i])+'</h2>'+
  '<div class="opts" role="radiogroup" aria-labelledby="h">';
  for(var k=0;k<3;k++){ h+='<button class="opt" role="radio" aria-checked="'+(v===k)+'" data-act="ans" data-v="'+k+'"><b>'+k+'</b><span>'+OPT[k]+'</span></button>'; }
  h+='</div>'+(v!==null?'<button class="lnk fwd" data-act="fwd">'+(i<11?'Continuă →':'Vezi rezultatul →')+'</button>':'')+'</div></section>';
  return h;
}
function vResult(){
  var sc=scores(), lw=lowest(sc);
  var h='<section class="scr">'+brandRow()+'<div class="main" style="justify-content:flex-start"><div class="line"></div><h2 id="h" tabindex="-1">Unde merită <em>să începi?</em></h2>'+
  '<p class="sub" style="font-size:18px">Scorul nu definește nivelul tău. Îți oferă un punct de plecare.</p><div class="rows">';
  for(var c=0;c<4;c++){
    var low=lw.indexOf(c)>-1;
    h+='<div class="card'+(low?' low':'')+'"><div class="ch"><span class="cn">'+CATS[c]+'</span><span class="sc">'+sc[c]+'<small>/6</small></span></div>'+
    '<div class="track"><div class="fill" data-w="'+Math.round(sc[c]/6*100)+'"></div></div>'+
    (low?'<span class="tag">Merită examinată prima</span>':'')+
    '<p class="int">'+INTERP[band(sc[c])]+'</p></div>';
  }
  h+='</div><p class="note">Important: scorul cel mai mic nu identifică automat cauza stagnării. El indică zona pe care merită să o examinezi prima. Uneori, progresul este influențat de mai mulți factori care se intersectează.</p>'+
  '<p class="note" style="margin-top:8px">Scorurile sunt un instrument de reflecție, nu o măsură a valorii tale sau o evaluare clinică.</p></div>'+
  '<div class="foot"><button class="btn" data-act="toPriority">Alege prioritatea</button><div style="display:flex;justify-content:space-between"><button class="lnk" data-act="back">Modifică răspunsurile</button><button class="lnk" data-act="reset">Reia evaluarea</button></div></div></section>';
  return h;
}
function vPriority(){
  var sc=scores(), h='<section class="scr">'+brandRow()+'<div class="main" style="justify-content:flex-start"><div class="line"></div><h2 id="h" tabindex="-1">Prioritatea <em>ta</em></h2>'+
  '<p class="sub" style="font-size:18px">Zona pe care alegi să o îmbunătățești prima.</p><div class="pick" role="radiogroup" aria-labelledby="h">';
  for(var c=0;c<4;c++){ h+='<button class="pk" role="radio" aria-checked="'+(S.pr===c)+'" data-act="pick" data-c="'+c+'">'+CATS[c]+'<span>'+sc[c]+'/6</span></button>'; }
  h+='</div><label class="fl" for="obs">Ce observ concret în viața mea?</label><textarea id="obs" maxlength="240" rows="2" data-f="obs" placeholder="O frază este suficientă">'+esc(S.obs)+'</textarea>'+
  '<label class="fl" for="tst">Ce schimbare mică pot testa în următoarele 7 zile?</label><textarea id="tst" maxlength="240" rows="2" data-f="test" placeholder="Ceva suficient de mic ca să-l repeți">'+esc(S.test)+'</textarea></div>'+
  '<div class="foot"><button class="btn" data-act="toPlan"'+(S.pr===null?' disabled':'')+' id="planbtn">Creează planul de 7 zile</button><button class="lnk" data-act="toResult">Înapoi la rezultat</button></div></section>';
  return h;
}
function vPlan(){
  var done=S.days.filter(Boolean).length;
  var h='<section class="scr">'+brandRow()+'<div class="main" style="justify-content:flex-start"><div class="line"></div><h2 id="h" tabindex="-1">Planul tău <em>de 7 zile</em></h2>'+
  '<p class="sub" style="font-size:18px">Mai puține promisiuni. Un pas pe care chiar îl faci.</p>'+
  (S.pr!==null?'<span class="chip">Prioritate: '+CATS[S.pr]+'</span>':'')+
  '<p class="cnum" id="cnt">'+done+' / 7 ZILE BIFATE</p><div class="days" role="group" aria-label="Planul de 7 zile">';
  for(var d=0;d<7;d++){ h+='<button class="day" role="checkbox" aria-checked="'+S.days[d]+'" data-act="day" data-d="'+d+'"><span class="d">Ziua '+(d+1)+'</span><span class="t">'+DAYS[d]+'</span><span class="bx"></span></button>'; }
  h+='</div><label class="fl" for="foc">În următoarele 7 zile mă concentrez pe:</label><textarea id="foc" maxlength="240" rows="2" data-f="focus">'+esc(S.focus||S.test)+'</textarea>'+
  '<label class="fl" for="sgn">Voi ști că am făcut un pas înainte atunci când:</label><textarea id="sgn" maxlength="240" rows="2" data-f="sign">'+esc(S.sign)+'</textarea>'+
  '<p class="quote">Nu am nevoie de o săptămână perfectă. Am nevoie de un pas repetabil.</p></div>'+
  '<div class="foot"><button class="btn sec" data-act="save">Salvează rezultatul (imagine)</button><button class="btn" data-act="toEnd">Continuă</button><button class="lnk" data-act="toPriority">Înapoi</button></div></section>';
  return h;
}
function vEnd(){
  return '<section class="scr">'+brandRow()+'<div class="main" style="justify-content:flex-start"><div class="line"></div><h2 id="h" tabindex="-1">Claritatea este <em>începutul.</em></h2>'+
  '<p class="quote" style="font-weight:700">Claritatea este începutul. Un plan potrivit, feedback-ul și ajustările făcute în timp pot transforma această claritate în progres.</p>'+
  '<div class="sys"><h3>Sistemul ESTETIQ FIT</h3><p>Un parcurs personalizat de 12 săptămâni, construit în jurul obiectivului tău, cu structură, educație, ghidaj, feedback și ajustări.</p></div>'+
  '<p class="small" style="margin-top:22px;line-height:1.5">Acest material are scop educațional și de auto-reflecție. Nu înlocuiește evaluarea individuală sau recomandările profesioniștilor medicali și de nutriție atunci când acestea sunt necesare.</p></div>'+
  '<div class="foot"><button class="btn" data-act="system">Descoperă Sistemul ESTETIQ FIT</button><div style="display:flex;justify-content:space-between"><button class="lnk" data-act="toPlan">Înapoi la plan</button><button class="lnk" data-act="reset">Reia evaluarea</button></div>'+
  '<p class="small" style="text-align:center">Antrenează inteligent. Construiește conștient.</p></div></section>';
}

function render(focusHeading){
  var s=S.screen, html='';
  if(s==='intro') html=vIntro(); else if(s==='q') html=vQ(); else if(s==='result') html=vResult(); else if(s==='priority') html=vPriority(); else if(s==='plan') html=vPlan(); else html=vEnd();
  root.innerHTML=html;
  pb.style.width = s==='q' ? Math.round(answeredCount()/12*100)+'%' : (s==='intro'?'0%':'100%');
  window.scrollTo(0,0);
  if(s==='result'){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ [].forEach.call(root.querySelectorAll('.fill'),function(f){f.style.width=f.getAttribute('data-w')+'%';}); }); }); }
  if(focusHeading){ var h=document.getElementById('h'); if(h){ h.setAttribute('tabindex','-1'); try{h.focus({preventScroll:true});}catch(e){} } }
}
function go(screen,q){ S.screen=screen; if(typeof q==='number') S.q=q; save(); render(true); }

/* ====== Acțiuni ====== */
var lock=false, resetArmed=false, resetTimer=null;
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },2600); }
function firstUnanswered(){ for(var i=0;i<12;i++){ if(S.a[i]===null) return i; } return -1; }

root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='start'){ var u=firstUnanswered(); if(u===-1) go('result'); else go('q',u); }
  else if(act==='ans'){ if(lock) return; var v=parseInt(el.getAttribute('data-v'),10); S.a[S.q]=v; save();
    [].forEach.call(root.querySelectorAll('.opt'),function(b){ b.setAttribute('aria-checked',String(b===el)); });
    pb.style.width=Math.round(answeredCount()/12*100)+'%'; lock=true;
    setTimeout(function(){ lock=false; if(S.screen!=='q') return; if(S.q<11) go('q',S.q+1); else go('result'); },260); }
  else if(act==='back'){ if(S.screen==='q'){ if(S.q>0) go('q',S.q-1); else go('intro'); } else if(S.screen==='result'){ go('q',11); } }
  else if(act==='fwd'){ if(S.a[S.q]===null) return; if(S.q<11) go('q',S.q+1); else go('result'); }
  else if(act==='toPriority'){ if(!allAnswered()){ go('q',Math.max(0,firstUnanswered())); return; }
    if(S.pr===null){ var lw=lowest(scores()); if(lw.length===1) S.pr=lw[0]; } go('priority'); }
  else if(act==='toResult'){ go('result'); }
  else if(act==='pick'){ S.pr=parseInt(el.getAttribute('data-c'),10); save();
    [].forEach.call(root.querySelectorAll('.pk'),function(b){ b.setAttribute('aria-checked',String(b===el)); });
    var pbn=document.getElementById('planbtn'); if(pbn) pbn.disabled=false; }
  else if(act==='toPlan'){ if(S.pr===null) return; if(!S.focus && S.test) S.focus=S.test; go('plan'); }
  else if(act==='day'){ var d=parseInt(el.getAttribute('data-d'),10); S.days[d]=!S.days[d]; save(); el.setAttribute('aria-checked',String(S.days[d]));
    var c=document.getElementById('cnt'); if(c) c.textContent=S.days.filter(Boolean).length+' / 7 ZILE BIFATE'; }
  else if(act==='toEnd'){ go('end'); }
  else if(act==='save'){ saveImage(); }
  else if(act==='system'){ if(SYSTEM_URL){ window.open(SYSTEM_URL,'_blank','noopener'); } else { toast('Linkul către sistem va fi adăugat la publicare.'); } }
  else if(act==='reset'){
    if(!resetArmed){ resetArmed=true; el.textContent='Sigur? Apasă din nou'; clearTimeout(resetTimer); resetTimer=setTimeout(function(){ resetArmed=false; if(el.isConnected) el.textContent='Reia evaluarea'; },3500); }
    else { resetArmed=false; clearTimeout(resetTimer); S=fresh(); try{localStorage.removeItem(KEY);}catch(x){} render(true); }
  }
});
root.addEventListener('input',function(e){ var f=e.target.getAttribute&&e.target.getAttribute('data-f'); if(f){ S[f]=e.target.value; save(); } });
document.addEventListener('keydown',function(e){
  if(S.screen!=='q'||lock) return; var tg=e.target&&e.target.tagName; if(tg==='TEXTAREA'||tg==='INPUT') return;
  if(e.key==='0'||e.key==='1'||e.key==='2'){ var b=root.querySelector('.opt[data-v="'+e.key+'"]'); if(b) b.click(); }
});

/* ====== Salvare rezultat (imagine PNG) ====== */
function wrap(ctx,text,x,y,maxW,lh,maxLines){
  var words=String(text||'').split(/\s+/).filter(Boolean), line='', lines=[];
  words.forEach(function(w){ var t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){ lines.push(line); line=w; } else line=t; });
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,'')+'…'; }
  lines.forEach(function(l,i){ ctx.fillText(l,x,y+i*lh); });
  return y+lines.length*lh;
}
function saveImage(){
  var go2=function(){
    var W=1080,H=1500,cv=document.createElement('canvas'); cv.width=W; cv.height=H; var c=cv.getContext('2d');
    c.fillStyle='#0A0A0A'; c.fillRect(0,0,W,H);
    c.fillStyle='#8C8C8C'; c.font='800 24px Montserrat, Arial'; c.letterSpacing='5px'; c.fillText('ESTETIQ FIT',64,86); c.textAlign='right'; c.fillText('PROGRESS CHECK',W-64,86); c.textAlign='left';
    c.letterSpacing='0px'; c.fillStyle='#FF3030'; c.fillRect(64,128,96,10);
    c.fillStyle='#fff'; c.font='900 84px Montserrat, Arial'; c.fillText('REZULTATUL TĂU',64,236);
    var sc=scores(), lw=lowest(sc), y=310;
    for(var i=0;i<4;i++){
      var low=lw.indexOf(i)>-1;
      c.fillStyle='#161616'; c.fillRect(64,y,W-128,120);
      if(low){ c.strokeStyle='#FF3030'; c.lineWidth=4; c.strokeRect(66,y+2,W-132,116); }
      c.fillStyle='#fff'; c.font='900 32px Montserrat, Arial'; c.fillText(CATS[i],94,y+48);
      c.textAlign='right'; c.font='900 44px Montserrat, Arial'; c.fillText(sc[i]+'/6',W-94,y+52); c.textAlign='left';
      c.fillStyle='#2A2A2A'; c.fillRect(94,y+78,W-188,16);
      c.fillStyle=low?'#FF3030':'#fff'; c.fillRect(94,y+78,(W-188)*sc[i]/6,16);
      y+=140;
    }
    y+=26; c.fillStyle='#FF3030'; c.font='900 24px Montserrat, Arial'; c.letterSpacing='4px'; c.fillText('PRIORITATEA MEA',64,y); c.letterSpacing='0px';
    c.fillStyle='#fff'; c.font='900 46px Montserrat, Arial'; c.fillText(S.pr!==null?CATS[S.pr]:'—',64,y+60); y+=104;
    c.font='700 30px Montserrat, Arial'; c.fillStyle='#8C8C8C'; c.fillText('Ce observ concret:',64,y); c.fillStyle='#fff'; y=wrap(c,S.obs||'—',64,y+42,W-128,40,2)+22;
    c.fillStyle='#8C8C8C'; c.fillText('Schimbarea pe care o testez 7 zile:',64,y); c.fillStyle='#fff'; y=wrap(c,S.focus||S.test||'—',64,y+42,W-128,40,2)+22;
    c.fillStyle='#8C8C8C'; c.fillText('Voi ști că am făcut un pas când:',64,y); c.fillStyle='#fff'; wrap(c,S.sign||'—',64,y+42,W-128,40,2);
    c.fillStyle='#FF3030'; c.font='900 28px Montserrat, Arial'; c.fillText('Un pas repetabil, nu o săptămână perfectă.',64,H-150);
    c.fillStyle='#8C8C8C'; c.font='700 22px Montserrat, Arial'; c.fillText('Antrenează inteligent. Construiește conștient.  |  @estetiq.fit',64,H-96);
    c.font='600 18px Montserrat, Arial'; c.fillText('Instrument de reflecție, nu evaluare clinică.',64,H-60);
    cv.toBlob(function(b){
      if(!b){ toast('Nu am putut crea imaginea.'); return; }
      var file; try{ file=new File([b],'estetiq-progress-check.png',{type:'image/png'}); }catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){ navigator.share({files:[file],title:'ESTETIQ FIT Progress Check'}).catch(function(){}); return; }
      var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='estetiq-progress-check.png'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Imaginea a fost descărcată.');
    },'image/png');
  };
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(go2); } else go2();
}

/* ====== Pornire ====== */
if(S.screen==='q' && answeredCount()===0 && S.q===0){ S.screen='intro'; }
render(false);
window.__PC = {state:function(){return JSON.parse(JSON.stringify(S));}, scores:scores, lowest:lowest};
})();
